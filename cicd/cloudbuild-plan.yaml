# =============================================================================
# Plan pipeline — runs on every PR/push that touches config/environments/<env>
# or modules/. Read-only: validates, renders, and plans. Never applies.
#
# Wire the trigger (one-time, per environment) with:
#
#   gcloud builds triggers create github \
#     --name="tf-plan-${_ENV}" \
#     --repo-owner=<org> --repo-name=<repo> \
#     --pull-request-pattern="^main$" \
#     --build-config=cicd/cloudbuild-plan.yaml \
#     --substitutions=_ENV=dev,_PROJECT_ID=prj-dg-devops-test,_STATE_BUCKET=<from bootstrap output>,_ARTIFACT_BUCKET=<from bootstrap output> \
#     --service-account=projects/<project>/serviceAccounts/tf-plan@<project>.iam.gserviceaccount.com
#
# See docs/cicd.md for the full one-time setup, including Workload Identity
# Federation so no service-account key is ever stored in Cloud Build.
# =============================================================================

steps:
  # 1. Validation — schema, dependency, security, naming, region, cost.
  #    Blocks here on any ERROR-severity finding; nothing after this step
  #    runs if validation fails (see docs/validation.md).
  - id: validate
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install -q -r engine/requirements.txt
        python -m engine.cli validate "config/environments/${_ENV}" --json | tee /workspace/validation.json
        python -c "import json,sys; sys.exit(1 if json.load(open('/workspace/validation.json'))['blocked'] else 0)"

  # 2. Render — writes the validated, normalized deployment.json Terraform
  #    actually reads. Only reachable if step 1 passed.
  - id: render
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python -m engine.cli render "config/environments/${_ENV}" \
          --out "environments/${_ENV}/.generated/deployment.normalized.json"
    waitFor: ["validate"]

  # 3. Hard-code scan — modules/, platform/, bootstrap/ must stay
  #    environment-agnostic.
  - id: hardcode-scan
    name: python:3.12-slim
    entrypoint: bash
    args: ["-c", "python -m engine.cli hardcode-scan ."]
    waitFor: ["validate"]

  # 4. terraform fmt -check — style gate, not a plan-blocker for anything
  #    else, but must pass before plan runs.
  - id: fmt-check
    name: hashicorp/terraform:1.9
    entrypoint: sh
    args: ["-c", "terraform fmt -check -recursive ."]
    waitFor: ["render"]

  # 5. terraform init + validate + plan, scoped to this environment's stack.
  - id: plan
    name: hashicorp/terraform:1.9
    entrypoint: sh
    dir: "environments/${_ENV}"
    args:
      - -c
      - |
        set -eu
        terraform init -input=false \
          -backend-config="bucket=${_STATE_BUCKET}" \
          -backend-config="prefix=${_ENV}"
        terraform validate
        terraform plan -input=false -out=tfplan
        terraform show -no-color tfplan > plan.txt
        terraform show -json tfplan > plan.json
    waitFor: ["fmt-check", "hardcode-scan"]

  # 6. Upload plan + validation report as artifacts — never applied
  #    automatically from this pipeline (see cloudbuild-apply.yaml).
  - id: upload-artifacts
    name: gcr.io/cloud-builders/gsutil
    args:
      - -m
      - cp
      - /workspace/validation.json
      - "environments/${_ENV}/plan.txt"
      - "environments/${_ENV}/plan.json"
      - "gs://${_ARTIFACT_BUCKET}/deployments/${_ENV}/${BUILD_ID}/"
    waitFor: ["plan"]

substitutions:
  _ENV: dev
  _PROJECT_ID: prj-dg-devops-test
  _STATE_BUCKET: ""
  _ARTIFACT_BUCKET: ""

options:
  logging: CLOUD_LOGGING_ONLY
  # This pipeline is meant to run as the read-only tf-plan service account
  # (see bootstrap/main.tf) — never grant it write roles.
