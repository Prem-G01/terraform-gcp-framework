# =============================================================================
# Label / tag engine
# -----------------------------------------------------------------------------
# `required` keys are merged onto every resource instance's `labels` during
# config_loader._apply_required_labels — unconditionally, as of 2026-08-25.
# (This previously only merged into instances that already declared their
# own `labels:` block, silently no-op'ing for everything else — the vast
# majority of real instances, and a real crash risk for
# modules/compute/vm, modules/compute/cloudrun, and
# modules/storage/buckets, which all read each.value.labels with no
# fallback. This comment also used to claim a security_engine.py
# enforcement pass that never existed; there is still no separate
# validation step — the guarantee comes entirely from this merge always
# running.) `{environment}` and `{owner}` are resolved from deployment
# metadata and config/global/defaults.yaml respectively. `optional_keys`
# below is documentation only — nothing validates that a config's extra
# label keys are limited to this list.
# =============================================================================

labels:
  required:
    managed_by: terraform
    environment: "{environment}"
    platform: gcp-platform
    owner: "{owner}"

  optional_keys:
    - cost_center
    - business_unit
    - compliance
    - application

tags:
  default:
    - terraform
    - managed
