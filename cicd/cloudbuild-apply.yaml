# =============================================================================
# Apply pipeline — runs only on merge to the environment's protected branch,
# as the tf-apply service account, and ONLY after the trigger's manual
# approval gate is satisfied:
#
#   gcloud builds triggers create github \
#     --name="tf-apply-${_ENV}" \
#     --repo-owner=<org> --repo-name=<repo> \
#     --branch-pattern="^main$" \
#     --build-config=cicd/cloudbuild-apply.yaml \
#     --require-approval \
#     --substitutions=_ENV=dev,_PROJECT_ID=prj-dg-devops-test,_STATE_BUCKET=<from bootstrap output>,_ARTIFACT_BUCKET=<from bootstrap output> \
#     --service-account=projects/<project>/serviceAccounts/tf-apply@<project>.iam.gserviceaccount.com
#
# `--require-approval` is what makes this "no developer runs production
# terraform from a laptop, and nothing applies without a human clicking
# approve" — see docs/cicd.md. Re-runs validation from scratch rather than
# trusting the plan pipeline's output, so an approval can never rubber-stamp
# a config that changed after the plan was reviewed.
# =============================================================================

steps:
  - id: validate
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        pip install -q -r engine/requirements.txt
        python -m engine.cli validate "config/environments/${_ENV}" --json | tee /workspace/validation.json
        python -c "import json,sys; sys.exit(1 if json.load(open('/workspace/validation.json'))['blocked'] else 0)"

  - id: render
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        python -m engine.cli render "config/environments/${_ENV}" \
          --out "environments/${_ENV}/.generated/deployment.normalized.json"
    waitFor: ["validate"]

  - id: apply
    name: hashicorp/terraform:1.9
    entrypoint: sh
    dir: "environments/${_ENV}"
    args:
      - -c
      - |
        set -eu
        terraform init -input=false \
          -backend-config="bucket=${_STATE_BUCKET}" \
          -backend-config="prefix=${_ENV}"
        terraform validate
        terraform plan -input=false -out=tfplan
        terraform apply -input=false -auto-approve tfplan
        terraform output -json > apply_outputs.json
    waitFor: ["render"]

  - id: upload-artifacts
    name: gcr.io/cloud-builders/gsutil
    args:
      - -m
      - cp
      - /workspace/validation.json
      - "environments/${_ENV}/apply_outputs.json"
      - "gs://${_ARTIFACT_BUCKET}/deployments/${_ENV}/${BUILD_ID}/"
    waitFor: ["apply"]

substitutions:
  _ENV: dev
  _PROJECT_ID: prj-dg-devops-test
  _STATE_BUCKET: ""
  _ARTIFACT_BUCKET: ""

options:
  logging: CLOUD_LOGGING_ONLY
